# Address Book application configuration for an in-memory H2 database.

spring.application.name=addressbook

# --- H2 in-memory data source -----------------------------------------------
# DB_CLOSE_DELAY=-1 keeps the schema/seeded rows alive within a single JVM run
# (otherwise Hibernate's shutdown sequence drops them).
spring.datasource.url=jdbc:h2:mem:addressbook;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# Enable and expose the built-in H2 web console so you can inspect data via a GUI.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Let JPA create the tables for this entity model at startup, then drop+recreate on restart.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
