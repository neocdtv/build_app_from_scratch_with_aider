# Application Name
spring.application.name=address-book

# H2 Database Configuration (In-Memory)
spring.datasource.url=jdbc:h2:mem:contactdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate Configuration - Changed from 'create-drop' to 'update' for better data persistence
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# H2 Console Enabled for Development
server.servlet.context-path=/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
