<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Address Book</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Address Book</h1>
        </header>

        <section class="search-section">
            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="Search contacts...">
                <button id="searchBtn">Search</button>
            </div>
        </section>

        <section class="form-section">
            <h2>Add/Edit Contact</h2>
            <form id="contactForm">
                <input type="hidden" id="contactId">
                
                <div class="form-group">
                    <label for="firstName">First Name *</label>
                    <input type="text" id="firstName" required maxlength="50">
                </div>

                <div class="form-group">
                    <label for="lastName">Last Name *</label>
                    <input type="text" id="lastName" required maxlength="50">
                </div>

                <div class="form-group">
                    <label for="email">Email *</label>
                    <input type="email" id="email" required maxlength="100">
                </div>

                <div class="form-group">
                    <label for="phoneNumber">Phone Number *</label>
                    <input type="text" id="phoneNumber" required maxlength="20">
                </div>

                <div class="form-group">
                    <label for="address">Address *</label>
                    <input type="text" id="address" required maxlength="255">
                </div>

                <div class="form-group">
                    <label for="category">Category *</label>
                    <input type="text" id="category" required maxlength="50">
                </div>

                <div class="form-actions">
                    <button type="submit" id="submitBtn">Save Contact</button>
                    <button type="button" id="cancelBtn" class="hidden">Cancel</button>
                </div>
            </form>
        </section>

        <section class="contacts-section">
            <h2>Contacts List</h2>
            <div id="contactsContainer">
                <div class="loading">Loading contacts...</div>
            </div>
        </section>
    </div>

    <script src="/js/app.js"></script>
</body>
</html>
