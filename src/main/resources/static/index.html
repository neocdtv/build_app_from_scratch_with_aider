<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Address Book</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Address Book</h1>
        <div class="controls">
            <input type="text" id="searchInput" placeholder="Search by name or category...">
            <button id="addBtn">Add Contact</button>
        </div>
        <table id="contactTable">
            <thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>Category</th><th>Actions</th></tr></thead>
            <tbody></tbody>
        </table>
    </div>
    <div id="modal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2 id="modalTitle">Add Contact</h2>
            <form id="contactForm">
                <input type="hidden" id="contactId">
                <label>First Name:</label><input type="text" id="firstName" required><br>
                <label>Last Name:</label><input type="text" id="lastName" required><br>
                <label>Email:</label><input type="email" id="email" required><br>
                <label>Phone:</label><input type="text" id="phoneNumber" required><br>
                <label>Address:</label><input type="text" id="address" required><br>
                <label>Category:</label><input type="text" id="category" required><br>
                <button type="submit">Save</button>
            </form>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
