<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Address Book</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Address Book</h1>
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="Search by name or category...">
            <button id="searchButton">Search</button>
        </div>
        <button id="addContactButton">Add New Contact</button>
        <table id="contactsTable">
            <thead>
                <tr>
                    <th>First Name</th><th>Last Name</th><th>Email</th>
                    <th>Phone</th><th>Address</th><th>Category</th><th>Actions</th>
                </tr>
            </thead>
            <tbody id="contactsBody"></tbody>
        </table>
    </div>

    <div id="contactFormModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2 id="modalTitle">Add Contact</h2>
            <form id="contactForm">
                <input type="hidden" id="contactId">
                <label for="firstName">First Name:</label>
                <input type="text" id="firstName" required>
                <label for="lastName">Last Name:</label>
                <input type="text" id="lastName" required>
                <label for="email">Email:</label>
                <input type="email" id="email" required>
                <label for="phoneNumber">Phone Number:</label>
                <input type="text" id="phoneNumber" required>
                <label for="address">Address:</label>
                <input type="text" id="address" required>
                <label for="category">Category:</label>
                <input type="text" id="category" required>
                <button type="submit">Save</button>
            </form>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
