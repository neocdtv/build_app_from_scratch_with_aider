<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Address Book</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Address Book</h1>
        
        <div class="search-section">
            <input type="text" id="searchInput" placeholder="Search by name or category...">
            <button onclick="searchContacts()">Search</button>
        </div>

        <div class="form-section">
            <h2 id="formTitle">Add New Contact</h2>
            <form id="contactForm">
                <input type="hidden" id="contactId">
                <input type="text" id="firstName" placeholder="First Name" required>
                <input type="text" id="lastName" placeholder="Last Name" required>
                <input type="email" id="email" placeholder="Email" required>
                <input type="text" id="phoneNumber" placeholder="Phone Number" required>
                <input type="text" id="address" placeholder="Address" required>
                <input type="text" id="category" placeholder="Category (e.g. Family)" required>
                <button type="submit">Save Contact</button>
                <button type="button" id="cancelBtn" style="display:none;" onclick="resetForm()">Cancel</button>
            </form>
        </div>

        <div class="list-section">
            <h2>Contacts</h2>
            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>Category</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="contactList"></tbody>
            </table>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
