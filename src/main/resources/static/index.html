<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Address Book</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Address Book</h1>

        <!-- Search Section -->
        <div class="search-section">
            <input type="text" id="searchInput" placeholder="Search by name or category...">
            <button id="searchBtn">Search</button>
            <button id="clearSearchBtn">Clear</button>
        </div>

        <!-- Form Section -->
        <div class="form-section">
            <h2 id="formTitle">Add New Contact</h2>
            <form id="contactForm">
                <input type="hidden" id="contactId">
                <div class="form-group">
                    <input type="text" id="firstName" placeholder="First Name" required>
                    <input type="text" id="lastName" placeholder="Last Name" required>
                </div>
                <div class="form-group">
                    <input type="email" id="email" placeholder="Email" required>
                    <input type="text" id="phoneNumber" placeholder="Phone Number" required>
                </div>
                <div class="form-group">
                    <input type="text" id="address" placeholder="Address" required>
                    <input type="text" id="category" placeholder="Category (e.g. Family, Work)" required>
                </div>
                <button type="submit" id="saveBtn">Save Contact</button>
                <button type="button" id="cancelBtn" class="hidden">Cancel</button>
            </form>
        </div>

        <!-- List Section -->
        <div class="list-section">
            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>Category</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="contactTableBody">
                    <!-- Contacts will be injected here -->
                </tbody>
            </table>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
