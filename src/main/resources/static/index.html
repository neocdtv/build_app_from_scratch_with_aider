<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Address Book</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="container">
    <h1>Address Book</h1>

    <!-- Search & Filter -->
    <div class="controls">
        <input type="text" id="searchInput" placeholder="Search by name or category...">
        <select id="categoryFilter">
            <option value="">All Categories</option>
            <option value="Friend">Friend</option>
            <option value="Work">Work</option>
            <option value="Family">Family</option>
            <option value="Colleague">Colleague</option>
        </select>
        <button id="filterBtn">Filter</button>
    </div>

    <!-- Contact List -->
    <table id="contactTable">
        <thead>
        <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Category</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody id="contactList"></tbody>
    </table>

    <!-- Add/Edit Modal -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2 id="modalTitle">Add Contact</h2>
            <form id="contactForm">
                <input type="hidden" id="contactId">
                <label>First Name</label>
                <input type="text" id="firstName" required maxlength="50">
                <span class="error" id="firstNameError"></span>

                <label>Last Name</label>
                <input type="text" id="lastName" required maxlength="50">
                <span class="error" id="lastNameError"></span>

                <label>Email</label>
                <input type="email" id="email" required>
                <span class="error" id="emailError"></span>

                <label>Phone</label>
                <input type="tel" id="phoneNumber" required pattern="^\+?[1-9]\d{1,14}$">
                <span class="error" id="phoneError"></span>

                <label>Address</label>
                <input type="text" id="address" maxlength="255">

                <label>Category</label>
                <select id="category">
                    <option value="">Select Category</option>
                    <option value="Friend">Friend</option>
                    <option value="Work">Work</option>
                    <option value="Family">Family</option>
                    <option value="Colleague">Colleague</option>
                </select>
                <span class="error" id="categoryError"></span>

                <button type="submit" id="submitBtn">Save</button>
                <button type="button" id="cancelBtn">Cancel</button>
            </form>
        </div>
    </div>

    <button id="addBtn">+ Add Contact</button>
</div>

<script src="app.js"></script>
</body>
</html>
