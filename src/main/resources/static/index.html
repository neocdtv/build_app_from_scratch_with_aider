<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Address Book</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Address Book</h1>
        <div class="controls">
            <input type="text" id="search" placeholder="Search name or category..." />
            <select id="categoryFilter">
                <option value="">All Categories</option>
                <option value="Work">Work</option>
                <option value="Family">Family</option>
                <option value="Friend">Friend</option>
                <option value="Acquaintance">Acquaintance</option>
            </select>
            <button id="openModalBtn">Add Contact</button>
        </div>
    </header>
    <main id="contactList"></main>

    <div id="modal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2 id="modalTitle">Add Contact</h2>
            <form id="contactForm">
                <input type="hidden" id="contactId" />
                <label>First Name <span class="required">*</span></label>
                <input type="text" id="firstName" required pattern="[A-Za-z\s]{1,50}" />
                
                <label>Last Name <span class="required">*</span></label>
                <input type="text" id="lastName" required pattern="[A-Za-z\s]{1,50}" />
                
                <label>Email <span class="required">*</span></label>
                <input type="email" id="email" required />
                
                <label>Phone Number <span class="required">*</span></label>
                <input type="tel" id="phoneNumber" required pattern="\+?[1-9]\d{1,14}" />
                
                <label>Address</label>
                <input type="text" id="address" maxlength="255" />
                
                <label>Category</label>
                <input type="text" id="category" list="categorySuggestions" maxlength="50" />
                <datalist id="categorySuggestions">
                    <option value="Work"><option value="Family"><option value="Friend"><option value="Acquaintance">
                </datalist>

                <div id="errorMessage" class="error"></div>
                <button type="submit" id="saveBtn">Save</button>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
