<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Address Book</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Address Book</h1>
        
        <div class="controls">
            <input type="text" id="searchInput" placeholder="Search by name or category...">
            <button onclick="showAddModal()">+ Add Contact</button>
        </div>

        <table id="contactTable">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Phone</th>
                    <th>Category</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>

        <!-- Contact Modal -->
        <div id="contactModal" class="modal">
            <div class="modal-content">
                <h2 id="modalTitle">Add Contact</h2>
                <form id="contactForm">
                    <input type="hidden" id="contactId">
                    <input type="text" id="firstName" placeholder="First Name" required>
                    <input type="text" id="lastName" placeholder="Last Name" required>
                    <input type="email" id="email" placeholder="Email" required>
                    <input type="text" id="phoneNumber" placeholder="Phone Number" required>
                    <input type="text" id="address" placeholder="Address" required>
                    <input type="text" id="category" placeholder="Category (e.g. Family, Work)" required>
                    <div class="modal-actions">
                        <button type="button" onclick="closeModal()">Cancel</button>
                        <button type="submit">Save</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
