<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Address Book</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <h1>Address Book</h1>

        <div class="controls">
            <input type="text" id="searchInput" placeholder="Search names or categories...">
            <button onclick="loadContacts()">Search</button>
            <button id="openAddModal" class="btn-primary">+ Add Contact</button>
        </div>

        <table id="contactTable">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Phone</th>
                    <th>Category</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="contactList"></tbody>
        </table>

        <!-- Modal for Add/Edit -->
        <div id="contactModal" class="modal">
            <div class="modal-content">
                <h2 id="modalTitle">Add Contact</h2>
                <form id="contactForm">
                    <input type="hidden" id="contactId">
                    <input type="text" id="firstName" placeholder="First Name" required>
                    <input type="text" id="lastName" placeholder="Last Name" required>
                    <input type="email" id="email" placeholder="Email" required>
                    <input type="text" id="phoneNumber" placeholder="Phone (E.164)" required>
                    <input type="text" id="address" placeholder="Address">
                    <input type="text" id="category" placeholder="Category">
                    <div class="modal-actions">
                        <button type="button" id="closeModal">Cancel</button>
                        <button type="submit" class="btn-primary">Save</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <script src="js/app.js"></script>
</body>
</html>
