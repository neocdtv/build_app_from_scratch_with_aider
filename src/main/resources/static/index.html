<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Address Book</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Address Book</h1>
        
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search by name or category...">
            <button onclick="searchContacts()">Search</button>
        </div>

        <form id="contactForm">
            <input type="hidden" id="contactId">
            <div class="form-group">
                <input type="text" id="firstName" placeholder="First Name" required>
                <input type="text" id="lastName" placeholder="Last Name" required>
            </div>
            <div class="form-group">
                <input type="email" id="email" placeholder="Email" required>
                <input type="text" id="phoneNumber" placeholder="Phone Number" required>
            </div>
            <div class="form-group">
                <input type="text" id="address" placeholder="Address" required>
                <input type="text" id="category" placeholder="Category (e.g. Work, Family)" required>
            </div>
            <button type="submit" id="saveBtn">Save Contact</button>
            <button type="button" id="cancelBtn" onclick="resetForm()" style="display:none;">Cancel</button>
        </form>

        <table id="contactTable">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Phone</th>
                    <th>Category</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="contactList"></tbody>
        </table>
    </div>
    <script src="app.js"></script>
</body>
</html>
