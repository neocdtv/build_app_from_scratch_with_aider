<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Address Book</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Address Book</h1>
        
        <!-- Search Section -->
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="Search by name or category...">
            <button onclick="searchContacts()">Search</button>
        </div>

        <!-- Contact List Table -->
        <div id="contactsContainer">
            <table id="contactsTable">
                <thead>
                    <tr>
                        <th>First Name</th>
                        <th>Last Name</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>Address</th>
                        <th>Category</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="contactsBody">
                    <!-- Contacts will be populated here -->
                </tbody>
            </table>
        </div>

        <br>
        <h2 id="formTitle">Add New Contact</h2>
        <form id="contactForm">
            <input type="hidden" id="contactId">
            
            <div class="form-group">
                <label>First Name</label>
                <input type="text" id="firstName" required>
            </div>
            
            <div class="form-group">
                <label>Last Name</label>
                <input type="text" id="lastName" required>
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" required>
            </div>

            <div class="form-group">
                <label>Phone Number</label>
                <input type="text" id="phoneNumber" required>
            </div>

            <div class="form-group">
                <label>Address</label>
                <input type="text" id="address" required>
            </div>

            <div class="form-group">
                <label>Category</label>
                <input type="text" id="category" required>
            </div>

            <button type="submit" id="submitBtn">Save</button>
            <button type="button" id="cancelBtn" style="display:none;" onclick="resetForm()">Cancel</button>
        </form>
    </div>

    <script src="app.js"></script>
</body>
</html>
