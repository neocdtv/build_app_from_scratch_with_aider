<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Address Book</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Address Book</h1>
        
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="Search by name or category...">
            <button id="searchBtn">Search</button>
            <button id="clearSearchBtn" style="display:none;">Clear</button>
        </div>

        <form id="contactForm">
            <input type="hidden" id="contactId">
            <div class="form-group">
                <label for="firstName">First Name *</label>
                <input type="text" id="firstName" required>
                <span class="error-msg"></span>
            </div>
            <div class="form-group">
                <label for="lastName">Last Name *</label>
                <input type="text" id="lastName" required>
                <span class="error-msg"></span>
            </div>
            <div class="form-group">
                <label for="email">Email *</label>
                <input type="email" id="email" required>
                <span class="error-msg"></span>
            </div>
            <div class="form-group">
                <label for="phoneNumber">Phone Number *</label>
                <input type="text" id="phoneNumber" required>
                <span class="error-msg"></span>
            </div>
            <div class="form-group">
                <label for="address">Address *</label>
                <input type="text" id="address" required>
                <span class="error-msg"></span>
            </div>
            <div class="form-group">
                <label for="category">Category *</label>
                <input type="text" id="category" required>
                <span class="error-msg"></span>
            </div>
            <button type="submit" id="submitBtn">Add Contact</button>
            <button type="button" id="cancelBtn" style="display:none;">Cancel Edit</button>
        </form>

        <table id="contactsTable">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Phone</th>
                    <th>Address</th>
                    <th>Category</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="contactsBody">
            </tbody>
        </table>
    </div>
    <script src="app.js"></script>
</body>
</html>
