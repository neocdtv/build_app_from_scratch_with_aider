<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Address Book</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Address Book</h1>
            <div id="search-bar">
                <input type="text" id="search-input" placeholder="Search by name or category...">
                <button id="search-btn">Search</button>
            </div>
        </header>

        <form id="contact-form">
            <h2 id="form-title">Add Contact</h2>
            <input type="hidden" id="contact-id">
            <div class="form-group"><label for="firstName">First Name *</label><input type="text" id="firstName" required maxlength="50"></div>
            <div class="form-group"><label for="lastName">Last Name *</label><input type="text" id="lastName" required maxlength="50"></div>
            <div class="form-group"><label for="email">Email *</label><input type="email" id="email" required maxlength="100"></div>
            <div class="form-group"><label for="phoneNumber">Phone Number *</label><input type="tel" id="phoneNumber" required maxlength="20"></div>
            <div class="form-group"><label for="address">Address *</label><input type="text" id="address" required maxlength="255"></div>
            <div class="form-group"><label for="category">Category *</label><input type="text" id="category" required maxlength="50"></div>
            <div class="form-actions">
                <button type="submit" id="submit-btn">Add Contact</button>
                <button type="button" id="cancel-btn" style="display:none;">Cancel</button>
            </div>
        </form>

        <table id="contacts-table">
            <thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>Category</th><th>Actions</th></tr></thead>
            <tbody id="contacts-list"></tbody>
        </table>
    </div>
    <script src="app.js"></script>
</body>
</html>
