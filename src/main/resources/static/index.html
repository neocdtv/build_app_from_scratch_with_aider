<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Manager</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Contact Manager</h1>
        </header>
        
        <div class="search-section">
            <input type="text" id="searchInput" class="search-input" placeholder="Search contacts..." onkeyup="searchContacts()">
        </div>
        
        <div class="form-section">
            <h2>Add/Edit Contact</h2>
            <form id="contactForm">
                <input type="hidden" id="contactId">
                
                <div class="form-group">
                    <label for="firstName">First Name *</label>
                    <input type="text" id="firstName" name="firstName" required placeholder="Enter first name">
                </div>
                
                <div class="form-group">
                    <label for="lastName">Last Name *</label>
                    <input type="text" id="lastName" name="lastName" required placeholder="Enter last name">
                </div>
                
                <div class="form-group">
                    <label for="email">Email *</label>
                    <input type="email" id="email" name="email" required placeholder="Enter email address">
                </div>
                
                <div class="form-group">
                    <label for="phone">Phone Number *</label>
                    <input type="tel" id="phone" name="phoneNumber" required placeholder="Enter phone number">
                </div>
                
                <div class="form-group">
                    <label for="address">Address *</label>
                    <input type="text" id="address" name="address" required placeholder="Enter address">
                </div>
                
                <div class="form-group">
                    <label for="category">Category *</label>
                    <input type="text" id="category" name="category" required placeholder="Enter category">
                </div>
                
                <div class="form-actions">
                    <button type="submit" id="submitBtn" class="btn btn-primary">Add Contact</button>
                    <button type="button" id="cancelBtn" class="btn btn-secondary" style="display: none;">Cancel</button>
                </div>
            </form>
        </div>
        
        <div class="contacts-section">
            <h2>All Contacts</h2>
            <div id="contactsContainer" class="contacts-grid">
                <p class="loading">Loading contacts...</p>
            </div>
        </div>
        
        <div id="message" class="message"></div>
    </div>
    
    <script src="/js/app.js"></script>
</body>
</html>
