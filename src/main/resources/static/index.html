<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Address Book</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <h1>Address Book</h1>
        
        <div class="search-section">
            <input type="text" id="searchInput" placeholder="Search contacts...">
            <button id="searchButton">Search</button>
        </div>
        
        <div class="form-section">
            <h2>Add New Contact</h2>
            <form id="contactForm">
                <div class="form-group">
                    <label for="firstName">First Name:</label>
                    <input type="text" id="firstName" required maxlength="50">
                </div>
                <div class="form-group">
                    <label for="lastName">Last Name:</label>
                    <input type="text" id="lastName" required maxlength="50">
                </div>
                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" required maxlength="100">
                </div>
                <div class="form-group">
                    <label for="phoneNumber">Phone Number:</label>
                    <input type="text" id="phoneNumber" required maxlength="20">
                </div>
                <div class="form-group">
                    <label for="address">Address:</label>
                    <input type="text" id="address" required maxlength="255">
                </div>
                <div class="form-group">
                    <label for="category">Category:</label>
                    <input type="text" id="category" required maxlength="50">
                </div>
                <button type="submit">Add Contact</button>
            </form>
        </div>
        
        <div class="contacts-section">
            <h2>Contacts</h2>
            <div id="contactsList"></div>
        </div>
    </div>
    
    <script src="js/app.js"></script>
</body>
</html>
