<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Address Book</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header><h1>Address Book</h1></header>
    <div class="controls">
        <input type="text" id="searchInput" placeholder="Search by name or category...">
        <button id="searchBtn">Search</button>
        <button id="clearBtn">Clear</button>
        <button id="addBtn">Add Contact</button>
    </div>
    <table id="contactsTable">
        <thead><tr><th>First Name</th><th>Last Name</th><th>Email</th><th>Phone</th><th>Category</th><th>Actions</th></tr></thead>
        <tbody></tbody>
    </table>

    <div id="modal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2 id="modalTitle">Add Contact</h2>
            <form id="contactForm">
                <input type="hidden" id="contactId">
                <label>First Name</label><input type="text" name="firstName" required maxlength="50">
                <label>Last Name</label><input type="text" name="lastName" required maxlength="50">
                <label>Email</label><input type="email" name="email" required>
                <label>Phone</label><input type="text" name="phoneNumber" pattern="^\+?[1-9]\d{1,14}$" required>
                <label>Address</label><input type="text" name="address" maxlength="255">
                <label>Category</label><input type="text" name="category" maxlength="50">
                <div id="formErrors" class="errors"></div>
                <button type="submit" id="submitBtn">Save</button>
            </form>
        </div>
    </div>

    <script src="/js/app.js"></script>
</body>
</html>
