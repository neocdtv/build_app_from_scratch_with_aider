<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Address Book</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <header>
        <h1>Address Book</h1>
        <input type="text" id="searchInput" placeholder="Search contacts...">
    </header>
    <main>
        <div class="controls">
            <button id="addBtn">Add New Contact</button>
        </div>
        <table id="contactTable">
            <thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>Category</th><th>Actions</th></tr></thead>
            <tbody></tbody>
        </table>
        <div id="formModal" class="modal hidden">
            <form id="contactForm">
                <h2 id="formTitle">Add Contact</h2>
                <input type="hidden" id="contactId">
                <label>First Name: <input type="text" id="firstName" required></label>
                <label>Last Name: <input type="text" id="lastName" required></label>
                <label>Email: <input type="email" id="email" required></label>
                <label>Phone: <input type="tel" id="phoneNumber" required></label>
                <label>Address: <input type="text" id="address" required></label>
                <label>Category: <input type="text" id="category" required></label>
                <button type="submit" id="saveBtn">Save</button>
                <button type="button" id="cancelBtn">Cancel</button>
            </form>
        </div>
    </main>
    <script src="/app.js"></script>
</body>
</html>
