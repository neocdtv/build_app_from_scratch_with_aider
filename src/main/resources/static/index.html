<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Address Book</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <h1>Address Book</h1>
        
        <div class="toolbar">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search contacts...">
                <select id="categoryFilter">
                    <option value="">All Categories</option>
                    <option value="Work">Work</option>
                    <option value="Family">Family</option>
                    <option value="Friend">Friend</option>
                    <option value="Other">Other</option>
                </select>
                <button id="searchBtn">Search</button>
            </div>
            <button id="addContactBtn" class="btn-primary">+ Add Contact</button>
        </div>

        <table id="contactsTable">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Phone</th>
                    <th>Category</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="contactsBody">
                <!-- Contacts will be injected here -->
            </tbody>
        </table>
    </div>

    <!-- Contact Modal -->
    <div id="contactModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2 id="modalTitle">Add Contact</h2>
            <form id="contactForm">
                <input type="hidden" id="contactId">
                <div class="form-group">
                    <label>First Name *</label>
                    <input type="text" id="firstName" required maxlength="50">
                </div>
                <div class="form-group">
                    <label>Last Name *</label>
                    <input type="text" id="lastName" required maxlength="50">
                </div>
                <div class="form-group">
                    <label>Email *</label>
                    <input type="email" id="email" required>
                </div>
                <div class="form-group">
                    <label>Phone *</label>
                    <input type="text" id="phoneNumber" required pattern="^\+?[1-9]\d{1,14}$" placeholder="+1234567890">
                </div>
                <div class="form-group">
                    <label>Address</label>
                    <input type="text" id="address" maxlength="255">
                </div>
                <div class="form-group">
                    <label>Category</label>
                    <input type="text" id="category" maxlength="50">
                </div>
                <button type="submit" class="btn-primary">Save Contact</button>
            </form>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
