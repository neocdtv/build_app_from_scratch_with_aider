<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Address Book</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Address Book</h1>
            <button id="open-modal-btn" class="btn btn-primary">+ Add Contact</button>
        </header>

        <section class="search-section">
            <input type="text" id="search-input" placeholder="Search name or category...">
            <select id="category-filter">
                <option value="">All Categories</option>
                <option value="Work">Work</option>
                <option value="Family">Family</option>
                <option value="Friend">Friend</option>
            </select>
        </section>

        <main>
            <table id="contact-table">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>Category</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="contact-list">
                    <!-- Dynamic content -->
                </tbody>
            </table>
        </main>
    </div>

    <!-- Modal for Add/Edit -->
    <div id="contact-modal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2 id="modal-title">Add Contact</h2>
            <form id="contact-form">
                <input type="hidden" id="contact-id">
                <div class="form-group">
                    <label for="first-name">First Name</label>
                    <input type="text" id="first-name" required>
                </div>
                <div class="form-group">
                    <label for="last-name">Last Name</label>
                    <input type="text" id="last-name" required>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" required>
                </div>
                <div class="form-group">
                    <label for="phone">Phone (E.164)</label>
                    <input type="text" id="phone" placeholder="+123456789" required pattern="^\+?[1-9]\d{1,14}$">
                </div>
                <div class="form-group">
                    <label for="address">Address</label>
                    <input type="text" id="address">
                </div>
                <div class="form-group">
                    <label for="category">Category</label>
                    <input type="text" id="category">
                </div>
                <button type="submit" class="btn btn-primary">Save Contact</button>
            </form>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
