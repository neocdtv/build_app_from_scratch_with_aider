<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Address Book</title><link rel="stylesheet" href="styles.css"></head>
<body>
<div class="container">
    <h1>Address Book</h1>
    <div class="search-bar">
        <input type="text" id="searchInput" placeholder="Search by name or category...">
        <button onclick="searchContacts()">Search</button>
        <button onclick="loadContacts()">Show All</button>
    </div>
    <form id="contactForm">
        <input type="hidden" id="contactId">
        <input type="text" id="firstName" placeholder="First Name" required>
        <input type="text" id="lastName" placeholder="Last Name" required>
        <input type="email" id="email" placeholder="Email" required>
        <input type="text" id="phoneNumber" placeholder="Phone Number" required>
        <input type="text" id="address" placeholder="Address" required>
        <input type="text" id="category" placeholder="Category" required>
        <button type="submit">Save Contact</button>
        <button type="button" onclick="resetForm()">Cancel</button>
    </form>
    <table><thead><tr><th>ID</th><th>Name</th><th>Email</th><th>Phone</th><th>Address</th><th>Category</th><th>Actions</th></tr></thead><tbody id="contactTableBody"></tbody></table>
</div>
<script src="app.js"></script>
</body>
</html>
