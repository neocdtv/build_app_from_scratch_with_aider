<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Address Book</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>Contact Manager</h1>
    <div class="controls">
        <input type="text" id="searchInput" placeholder="Search by name or category...">
        <button onclick="loadContacts()">Refresh</button>
    </div>
    <form id="contactForm">
        <input type="hidden" id="contactId">
        <input type="text" id="firstName" placeholder="First Name" required>
        <input type="text" id="lastName" placeholder="Last Name" required>
        <input type="email" id="email" placeholder="Email" required>
        <input type="text" id="phoneNumber" placeholder="Phone Number" required>
        <input type="text" id="address" placeholder="Address" required>
        <input type="text" id="category" placeholder="Category (e.g., Family, Work)" required>
        <button type="submit">Save Contact</button>
    </form>
    <table>
        <thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>Category</th><th>Actions</th></tr></thead>
        <tbody id="contactTableBody"></tbody>
    </table>
    <script src="app.js"></script>
</body>
</html>
