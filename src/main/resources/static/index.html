<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Address Book</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Address Book</h1>
        </header>

        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Search contacts..." class="search-input">
        </div>

        <div class="main-content">
            <div class="form-container">
                <h2 id="formTitle">Add Contact</h2>
                <form id="contactForm">
                    <input type="hidden" id="contactId">
                    
                    <div class="form-group">
                        <label for="myName">First Name:</label>
                        <input type="text" id="myName" name="myName" required maxlength="50">
                    </div>

                    <div class="form-group">
                        <label for="lastName">Last Name:</label>
                        <input type="text" id="lastName" name="lastName" required maxlength="50">
                    </div>

                    <div class="form-group">
                        <label for="email">Email:</label>
                        <input type="email" id="email" name="email" required maxlength="100">
                    </div>

                    <div class="form-group">
                        <label for="phoneNumber">Phone Number:</label>
                        <input type="tel" id="phoneNumber" name="phoneNumber" required maxlength="20">
                    </div>

                    <div class="form-group">
                        <label for="address">Address:</label>
                        <input type="text" id="address" name="address" required maxlength="255">
                    </div>

                    <div class="form-group">
                        <label for="category">Category:</label>
                        <input type="text" id="category" name="category" required maxlength="50">
                    </div>

                    <div class="form-buttons">
                        <button type="submit" id="submitBtn" class="btn btn-primary">Add Contact</button>
                        <button type="button" id="cancelBtn" class="btn btn-secondary">Cancel</button>
                    </div>
                </form>
            </div>

            <div class="table-container">
                <h2>Contacts</h2>
                <table id="contactsTable">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Phone</th>
                            <th>Category</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="contactsBody">
                        <tr>
                            <td colspan="5" class="loading">Loading contacts...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="/js/app.js"></script>
</body>
</html>
