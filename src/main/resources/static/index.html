<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Address Book</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📇 Address Book</h1>
            <div class="search-section">
                <input type="text" id="searchInput" placeholder="Search by name or category...">
                <button id="searchBtn">Search</button>
                <button id="clearSearchBtn">Clear</button>
            </div>
        </header>
        
        <main>
            <div class="action-bar">
                <button id="addContactBtn" class="btn btn-primary">+ Add Contact</button>
                <span id="contactCount" class="contact-count">0 contacts</span>
            </div>
            
            <div id="messageArea" class="message-area"></div>
            
            <div class="contacts-container">
                <table id="contactsTable" class="contacts-table">
                    <thead>
                        <tr>
                            <th>First Name</th>
                            <th>Last Name</th>
                            <th>Email</th>
                            <th>Phone</th>
                            <th>Address</th>
                            <th>Category</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="contactsBody">
                    </tbody>
                </table>
            </div>
        </main>
    </div>
    
    <!-- Modal for Add/Edit Contact -->
    <div id="contactModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Add Contact</h2>
                <button id="closeModalBtn" class="close-btn">&times;</button>
            </div>
            <form id="contactForm">
                <input type="hidden" id="contactId">
                <div class="form-group">
                    <label for="firstName">First Name *</label>
                    <input type="text" id="firstName" name="firstName" required>
                    <span class="error-message" id="firstNameError"></span>
                </div>
                <div class="form-group">
                    <label for="lastName">Last Name *</label>
                    <input type="text" id="lastName" name="lastName" required>
                    <span class="error-message" id="lastNameError"></span>
                </div>
                <div class="form-group">
                    <label for="email">Email *</label>
                    <input type="email" id="email" name="email" required>
                    <span class="error-message" id="emailError"></span>
                </div>
                <div class="form-group">
                    <label for="phoneNumber">Phone Number *</label>
                    <input type="tel" id="phoneNumber" name="phoneNumber" required>
                    <span class="error-message" id="phoneNumberError"></span>
                </div>
                <div class="form-group">
                    <label for="address">Address *</label>
                    <input type="text" id="address" name="address" required>
                    <span class="error-message" id="addressError"></span>
                </div>
                <div class="form-group">
                    <label for="category">Category/Tag *</label>
                    <select id="category" name="category" required>
                        <option value="">Select Category</option>
                        <option value="Work">Work</option>
                        <option value="Family">Family</option>
                        <option value="Friends">Friends</option>
                        <option value="Other">Other</option>
                    </select>
                    <span class="error-message" id="categoryError"></span>
                </div>
                <div class="form-actions">
                    <button type="submit" id="submitBtn" class="btn btn-primary">Save Contact</button>
                    <button type="button" id="cancelBtn" class="btn btn-secondary">Cancel</button>
                </div>
            </form>
        </div>
    </div>
    
    <script src="/js/app.js"></script>
</body>
</html>
