<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Address Book</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>Address Book</h1>
        <div class="controls">
            <input type="text" id="searchInput" placeholder="Search name or category...">
            <select id="categoryFilter">
                <option value="">All Categories</option>
                <option value="Work">Work</option>
                <option value="Personal">Personal</option>
                <option value="Family">Family</option>
            </select>
            <button id="addContactBtn">Add Contact</button>
        </div>
    </header>
    <main>
        <table id="contactTable">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Phone</th>
                    <th>Category</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="contactList"></tbody>
        </table>
    </main>

    <div id="modal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2 id="modalTitle">Add Contact</h2>
            <form id="contactForm">
                <input type="hidden" id="contactId">
                <div class="form-group">
                    <label for="firstName">First Name</label>
                    <input type="text" id="firstName" required maxlength="50">
                    <span class="error"></span>
                </div>
                <div class="form-group">
                    <label for="lastName">Last Name</label>
                    <input type="text" id="lastName" required maxlength="50">
                    <span class="error"></span>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" required>
                    <span class="error"></span>
                </div>
                <div class="form-group">
                    <label for="phoneNumber">Phone</label>
                    <input type="text" id="phoneNumber" required pattern="^\+?[1-9]\d{1,14}$">
                    <span class="error"></span>
                </div>
                <div class="form-group">
                    <label for="address">Address</label>
                    <input type="text" id="address" maxlength="255">
                    <span class="error"></span>
                </div>
                <div class="form-group">
                    <label for="category">Category</label>
                    <input type="text" id="category" maxlength="50">
                    <span class="error"></span>
                </div>
                <button type="submit">Save</button>
            </form>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
