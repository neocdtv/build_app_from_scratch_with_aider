<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Address Book</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Contact Manager</h1>
            <p>Add, edit, search and delete your contacts easily.</p>
        </header>

        <!-- Search Bar -->
        <section class="search-section">
            <input type="text" id="searchInput" placeholder="Search by name or category...">
            <button id="searchBtn">Search</button>
        </section>

        <!-- Contact Form (Add / Edit) -->
        <section class="form-section card">
            <h2 id="formTitle">Add New Contact</h2>
            <form id="contactForm">
                <input type="hidden" id="contactId">
                
                <div class="form-group">
                    <label for="firstName">First Name *</label>
                    <input type="text" id="firstName" required maxlength="50">
                </div>
                <div class="form-group">
                    <label for="lastName">Last Name *</label>
                    <input type="text" id="lastName" required maxlength="50">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="email">Email *</label>
                        <input type="email" id="email" required maxlength="100">
                    </div>
                    <div class="form-group">
                        <label for="phoneNumber">Phone Number *</label>
                        <input type="tel" id="phoneNumber" required maxlength="20">
                    </div>
                </div>
                <div class="form-group">
                    <label for="address">Address</label>
                    <textarea id="address" rows="3" maxlength="255"></textarea>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="category">Category / Tag *</label>
                        <select id="category" required>
                            <option value="">Select...</option>
                            <option value="Family">Family</option>
                            <option value="Work">Work</option>
                            <option value="Friends">Friends</option>
                            <option value="Colleagues">Colleagues</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    <div class="form-actions">
                        <button type="submit" id="saveBtn">Save Contact</button>
                        <button type="button" id="cancelBtn" style="display: none;">Cancel</button>
                    </div>
                </div>
            </form>
        </section>

        <!-- Contacts List -->
        <main class="contacts-section card">
            <h2>All Contacts (<span id="contactCount">0</span>)</h2>
            <div id="loadingIndicator" class="hidden">Loading...</div>
            <table id="contactsTable">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>Category</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="contactsBody">
                    <!-- Rows injected via JS -->
                </tbody>
            </table>
        </main>

        <footer>
            &copy; 2024 Address Book Web App | Powered by Spring Boot &amp; Vanilla JS
        </footer>
    </div>
    <script src="/app.js"></script>
</body>
</html>
