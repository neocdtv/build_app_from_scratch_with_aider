<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Address Book</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<div class="container">
    <header>
        <h1>Address Book</h1>
    </header>

    <section class="panel">
        <form id="contact-form">
            <input type="hidden" id="contact-id">
            <div class="grid">
                <label>First Name
                    <input type="text" id="firstName" required>
                </label>
                <label>Last Name
                    <input type="text" id="lastName" required>
                </label>
                <label>Email
                    <input type="email" id="email" required>
                </label>
                <label>Phone Number
                    <input type="text" id="phoneNumber" required>
                </label>
                <label>Category
                    <input type="text" id="category" placeholder="e.g. Family, Work" required>
                </label>
            </div>
            <label class="full">Address
                <input type="text" id="address" required>
            </label>
            <div class="actions">
                <button type="submit" id="save-button" class="primary">Add Contact</button>
                <button type="button" id="cancel-button" class="secondary hidden">Cancel</button>
            </div>
        </form>
    </section>

    <section class="panel">
        <div class="toolbar">
            <input type="search" id="search-input" placeholder="Search by name or category...">
        </div>
        <table class="contacts-table">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Phone</th>
                    <th>Address</th>
                    <th>Category</th>
                    <th class="actions-col">Actions</th>
                </tr>
            </thead>
            <tbody id="contacts-body"></tbody>
        </table>
    </section>
</div>

<script src="/js/app.js"></script>
</body>
</html>
