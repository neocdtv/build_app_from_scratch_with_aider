<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Address Book</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/app.js" defer></script>
</head>
<body>
    <div class="container">
        <h1>Address Book</h1>

        <section class="search-section">
            <input type="text" id="searchInput" placeholder="Search by name or category...">
        </section>

        <section class="form-section">
            <form id="contactForm">
                <input type="hidden" id="contactId">
                <div class="form-group">
                    <label for="firstName">First Name</label>
                    <input type="text" id="firstName" required maxlength="50">
                </div>
                <div class="form-group">
                    <label for="lastName">Last Name</label>
                    <input type="text" id="lastName" required maxlength="50">
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" required maxlength="100">
                </div>
                <div class="form-group">
                    <label for="phoneNumber">Phone Number</label>
                    <input type="text" id="phoneNumber" maxlength="20">
                </div>
                <div class="form-group">
                    <label for="address">Address</label>
                    <input type="text" id="address" maxlength="255">
                </div>
                <div class="form-group">
                    <label for="category">Category</label>
                    <input type="text" id="category" maxlength="50">
                </div>
                <button type="submit" id="saveButton">Save Contact</button>
                <button type="button" id="cancelButton" class="hidden">Cancel</button>
            </form>
        </section>

        <section class="list-section">
            <h2>Contacts</h2>
            <div id="contactList">
                <!-- Contacts will be populated here -->
            </div>
        </section>
    </div>
</body>
</html>
