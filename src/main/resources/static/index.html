<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Address Book</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Address Book</h1>
        </header>

        <div class="main-content">
            <div class="search-section">
                <input type="text" id="searchInput" class="search-input" placeholder="Search by name or category...">
            </div>

            <div class="form-section">
                <h2 id="formTitle">Add Contact</h2>
                <form id="contactForm">
                    <input type="hidden" id="contactId">
                    <div class="form-group">
                        <label for="firstName">First Name *</label>
                        <input type="text" id="firstName" name="firstName" required>
                    </div>
                    <div class="form-group">
                        <label for="lastName">Last Name *</label>
                        <input type="text" id="lastName" name="lastName" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Email *</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    <div class="form-group">
                        <label for="phoneNumber">Phone Number *</label>
                        <input type="text" id="phoneNumber" name="phoneNumber" required>
                    </div>
                    <div class="form-group">
                        <label for="address">Address *</label>
                        <input type="text" id="address" name="address" required>
                    </div>
                    <div class="form-group">
                        <label for="category">Category *</label>
                        <input type="text" id="category" name="category" required>
                    </div>
                    <div class="form-actions">
                        <button type="submit" id="submitBtn">Add Contact</button>
                        <button type="button" id="cancelBtn" class="hidden" onclick="resetForm()">Cancel</button>
                    </div>
                </form>
            </div>

            <div class="contacts-section">
                <h2>Contacts List</h2>
                <div id="contactsContainer" class="contacts-list">
                    <!-- Contacts will be loaded here -->
                </div>
            </div>
        </div>
    </div>

    <script src="/js/app.js"></script>
</body>
</html>
