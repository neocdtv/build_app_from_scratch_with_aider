<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Address Book</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Address Book</h1>
        </header>
        
        <div class="main-content">
            <section class="form-section">
                <h2 id="form-title">Add New Contact</h2>
                <form id="contact-form">
                    <input type="hidden" id="contact-id" name="id">
                    
                    <div class="form-group">
                        <label for="first-name">First Name *</label>
                        <input type="text" id="first-name" name="firstName" required minlength="1" maxlength="50">
                    </div>
                    
                    <div class="form-group">
                        <label for="last-name">Last Name *</label>
                        <input type="text" id="last-name" name="lastName" required minlength="1" maxlength="50">
                    </div>
                    
                    <div class="form-group">
                        <label for="email">Email *</label>
                        <input type="email" id="email" name="email" required minlength="1" maxlength="100">
                    </div>
                    
                    <div class="form-group">
                        <label for="phone">Phone Number *</label>
                        <input type="tel" id="phone" name="phoneNumber" required minlength="1" maxlength="20">
                    </div>
                    
                    <div class="form-group">
                        <label for="address">Address *</label>
                        <input type="text" id="address" name="address" required minlength="1" maxlength="255">
                    </div>
                    
                    <div class="form-group">
                        <label for="category">Category *</label>
                        <input type="text" id="category" name="category" required minlength="1" maxlength="50">
                    </div>
                    
                    <div class="form-actions">
                        <button type="submit" id="submit-btn">Add Contact</button>
                        <button type="button" id="cancel-btn" class="hidden" onclick="resetForm()">Cancel</button>
                    </div>
                </form>
            </section>
            
            <section class="search-section">
                <div class="search-container">
                    <input type="text" id="search-input" placeholder="Search contacts..." oninput="handleSearch()">
                </div>
            </section>
            
            <section class="contacts-section">
                <h2>Contacts</h2>
                <div id="contacts-container" class="contacts-grid">
                    <div class="loading">Loading contacts...</div>
                </div>
            </section>
        </div>
        
        <footer>
            <p>&copy; 2024 Address Book Application</p>
        </footer>
    </div>
    
    <script src="/js/app.js"></script>
</body>
</html>
