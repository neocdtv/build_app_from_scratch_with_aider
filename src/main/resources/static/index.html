<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Address Book</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Address Book</h1>
            <button id="addContactBtn" class="btn-primary">Add Contact</button>
        </header>
        
        <div class="search-section">
            <input type="text" id="searchInput" placeholder="Search by name, category...">
            <select id="categoryFilter">
                <option value="">All Categories</option>
                <option value="Friend">Friend</option>
                <option value="Family">Family</option>
                <option value="Colleague">Colleague</option>
                <option value="Acquaintance">Acquaintance</option>
            </select>
            <button id="searchBtn" class="btn-secondary">Search</button>
        </div>
        
        <div id="contactsList" class="contacts-list">
            <!-- Contacts will be loaded here -->
        </div>
        
        <div id="contactModal" class="modal">
            <div class="modal-content">
                <span class="close">&times;</span>
                <h2 id="modalTitle">Add Contact</h2>
                <form id="contactForm">
                    <input type="hidden" id="contactId">
                    <div class="form-group">
                        <label for="firstName">First Name *</label>
                        <input type="text" id="firstName" required maxlength="50">
                        <span class="error"></span>
                    </div>
                    <div class="form-group">
                        <label for="lastName">Last Name *</label>
                        <input type="text" id="lastName" required maxlength="50">
                        <span class="error"></span>
                    </div>
                    <div class="form-group">
                        <label for="email">Email *</label>
                        <input type="email" id="email" required>
                        <span class="error"></span>
                    </div>
                    <div class="form-group">
                        <label for="phoneNumber">Phone Number *</label>
                        <input type="tel" id="phoneNumber" required pattern="^\+?[1-9]\d{1,14}$">
                        <span class="error"></span>
                    </div>
                    <div class="form-group">
                        <label for="address">Address</label>
                        <input type="text" id="address" maxlength="255">
                        <span class="error"></span>
                    </div>
                    <div class="form-group">
                        <label for="category">Category</label>
                        <select id="category">
                            <option value="">Select Category</option>
                            <option value="Friend">Friend</option>
                            <option value="Family">Family</option>
                            <option value="Colleague">Colleague</option>
                            <option value="Acquaintance">Acquaintance</option>
                        </select>
                        <span class="error"></span>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn-primary">Save</button>
                        <button type="button" class="btn-secondary" id="cancelBtn">Cancel</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    
    <script src="js/app.js"></script>
</body>
</html>
