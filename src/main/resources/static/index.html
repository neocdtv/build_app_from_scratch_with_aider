<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Address Book</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Address Book</h1>
        
        <section class="search-bar">
            <input type="text" id="searchInput" placeholder="Search by name or category...">
            <button onclick="loadContacts()">Search</button>
        </section>

        <section class="form-section">
            <h2>Add / Edit Contact</h2>
            <form id="contactForm">
                <input type="hidden" id="contactId">
                <div class="form-row">
                    <input type="text" id="firstName" placeholder="First Name" required>
                    <input type="text" id="lastName" placeholder="Last Name" required>
                </div>
                <div class="form-row">
                    <input type="email" id="email" placeholder="Email" required>
                    <input type="text" id="phoneNumber" placeholder="Phone Number" required>
                </div>
                <input type="text" id="address" placeholder="Address" required>
                <input type="text" id="category" placeholder="Category (e.g., Family, Work)" required>
                <div class="form-actions">
                    <button type="submit" id="saveBtn">Save Contact</button>
                    <button type="button" onclick="resetForm()">Cancel</button>
                </div>
            </form>
        </section>

        <section class="contacts-table">
            <h2>Contacts</h2>
            <table>
                <thead>
                    <tr>
                        <th>First Name</th><th>Last Name</th><th>Email</th>
                        <th>Phone</th><th>Address</th><th>Category</th><th>Actions</th>
                    </tr>
                </thead>
                <tbody id="contactList"></tbody>
            </table>
        </section>
    </div>
    <script src="app.js"></script>
</body>
</html>
