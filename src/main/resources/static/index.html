<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Address Book</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Address Book</h1>
        
        <div class="search-section">
            <input type="text" id="search-input" placeholder="Search by name or category...">
            <button id="search-btn">Search</button>
            <button id="add-contact-btn">Add New Contact</button>
        </div>

        <div id="contact-form" class="hidden">
            <h2 id="form-title">Add Contact</h2>
            <form id="contact-form-el">
                <input type="text" id="first-name" placeholder="First Name" required>
                <input type="text" id="last-name" placeholder="Last Name" required>
                <input type="email" id="email" placeholder="Email" required>
                <input type="text" id="phone-number" placeholder="Phone Number" required>
                <input type="text" id="address" placeholder="Address" required>
                <input type="text" id="category" placeholder="Category" required>
                <div class="form-buttons">
                    <button type="submit" id="save-btn">Save</button>
                    <button type="button" id="cancel-btn">Cancel</button>
                </div>
            </form>
        </div>

        <table id="contacts-table">
            <thead>
                <tr>
                    <th>First Name</th>
                    <th>Last Name</th>
                    <th>Email</th>
                    <th>Phone</th>
                    <th>Address</th>
                    <th>Category</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="contacts-body">
            </tbody>
        </table>
    </div>
    <script src="app.js"></script>
</body>
</html>
