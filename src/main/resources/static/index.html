<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Address Book</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <div class="container">
        <h1>Address Book</h1>
        
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="Search contacts...">
            <button onclick="searchContacts()">Search</button>
        </div>

        <div class="form-container">
            <h2 id="formTitle">Add Contact</h2>
            <form id="contactForm">
                <input type="hidden" id="contactId">
                
                <div class="form-group">
                    <label>First Name</label>
                    <input type="text" id="firstName" required>
                </div>
                <div class="form-group">
                    <label>Last Name</label>
                    <input type="text" id="lastName" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" required>
                </div>
                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="text" id="phoneNumber" required>
                </div>
                <div class="form-group">
                    <label>Address</label>
                    <input type="text" id="address" required>
                </div>
                <div class="form-group">
                    <label>Category</label>
                    <input type="text" id="category" required>
                </div>

                <button type="submit" id="submitBtn">Add Contact</button>
                <button type="button" onclick="clearForm()" style="display:none;" id="cancelBtn">Cancel</button>
            </form>
        </div>

        <table id="contactTable">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Phone</th>
                    <th>Address</th>
                    <th>Category</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="contactList">
                <!-- Contacts will be injected here -->
            </tbody>
        </table>
    </div>

    <script src="/app.js"></script>
</body>
</html>
