<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Address Book</title><link rel="stylesheet" href="css/style.css"></head>
<body>
<div class="container">
    <h1>Address Book</h1>
    <div class="controls">
        <input type="text" id="searchInput" placeholder="Search by name or category...">
        <button id="addContactBtn">Add Contact</button>
    </div>
    <table id="contactTable"><thead><tr><th>First Name</th><th>Last Name</th><th>Email</th><th>Phone</th><th>Category</th><th>Actions</th></tr></thead><tbody id="contactList"></tbody></table>
</div>
<div id="modal" class="modal">
    <div class="modal-content"><span class="close">&times;</span><h2 id="modalTitle">Add Contact</h2>
        <form id="contactForm">
            <input type="hidden" id="contactId">
            <label>First Name: <input type="text" id="firstName" required pattern="[A-Za-z\s]{1,50}"></label>
            <label>Last Name: <input type="text" id="lastName" required pattern="[A-Za-z\s]{1,50}"></label>
            <label>Email: <input type="email" id="email" required></label>
            <label>Phone: <input type="tel" id="phoneNumber" required pattern="\+?[1-9]\d{1,14}"></label>
            <label>Address: <input type="text" id="address" maxlength="255"></label>
            <label>Category: <input type="text" id="category" maxlength="50"></label>
            <button type="submit">Save</button>
        </form>
    </div>
</div>
<script src="js/app.js"></script>
</body>
</html>
