<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Address Book</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <header><h1>Address Book</h1></header>
    <main>
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="Search by name or category...">
            <button onclick="loadContacts()">Search</button>
        </div>
        <button id="addBtn" onclick="openModal()">Add Contact</button>
        <table id="contactTable">
            <thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>Category</th><th>Actions</th></tr></thead>
            <tbody></tbody>
        </table>
    </main>
    <div id="modal" class="modal">
        <form id="contactForm">
            <input type="hidden" id="contactId">
            <label>First Name:</label><input type="text" id="firstName" required>
            <label>Last Name:</label><input type="text" id="lastName" required>
            <label>Email:</label><input type="email" id="email" required>
            <label>Phone:</label><input type="text" id="phoneNumber" required>
            <label>Address:</label><input type="text" id="address" required>
            <label>Category:</label><input type="text" id="category" required>
            <button type="submit">Save</button>
            <button type="button" onclick="closeModal()">Cancel</button>
        </form>
    </div>
    <script src="/js/app.js"></script>
</body>
</html>
