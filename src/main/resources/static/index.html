<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Address Book</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Address Book</h1>
            <div id="search-container">
                <input type="text" id="search-input" placeholder="Search by name or category...">
                <button onclick="searchContacts()">Search</button>
            </div>
        </header>

        <main>
            <section id="add-contact-form">
                <h2 id="form-title">Add New Contact</h2>
                <form id="contact-form">
                    <input type="hidden" id="contact-id">
                    
                    <div class="form-group">
                        <label for="firstName">First Name</label>
                        <input type="text" id="firstName" required>
                    </div>

                    <div class="form-group">
                        <label for="lastName">Last Name</label>
                        <input type="text" id="lastName" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" required>
                    </div>

                    <div class="form-group">
                        <label for="phoneNumber">Phone Number</label>
                        <input type="text" id="phoneNumber" required>
                    </div>

                    <div class="form-group">
                        <label for="address">Address</label>
                        <input type="text" id="address" required>
                    </div>

                    <div class="form-group">
                        <label for="category">Category</label>
                        <input type="text" id="category" required>
                    </div>

                    <div class="actions">
                        <button type="submit" id="save-btn">Add Contact</button>
                        <button type="button" onclick="resetForm()" style="display:none" id="cancel-edit-btn">Cancel Edit</button>
                    </div>
                </form>
            </section>

            <section id="contacts-list">
                <h2>Contact List</h2>
                <table id="contacts-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Phone</th>
                            <th>Address</th>
                            <th>Category</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="contacts-body">
                        <!-- Contacts will be populated here -->
                    </tbody>
                </table>
            </section>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
