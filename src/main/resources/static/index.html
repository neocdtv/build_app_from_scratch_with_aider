<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Address Book</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Address Book</h1>
            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="Search contacts...">
                <select id="categoryFilter">
                    <option value="">All Categories</option>
                    <option value="Family">Family</option>
                    <option value="Work">Work</option>
                    <option value="Friend">Friend</option>
                </select>
                <button id="searchBtn">Search</button>
            </div>
        </header>

        <div class="actions">
            <button id="addBtn" class="btn btn-primary">Add Contact</button>
        </div>

        <div id="contactList" class="contact-list"></div>

        <div id="modal" class="modal">
            <div class="modal-content">
                <span class="close">&times;</span>
                <h2 id="modalTitle">Add Contact</h2>
                <form id="contactForm">
                    <input type="hidden" id="contactId">
                    <div class="form-group">
                        <label for="firstName">First Name *</label>
                        <input type="text" id="firstName" required maxlength="50">
                    </div>
                    <div class="form-group">
                        <label for="lastName">Last Name *</label>
                        <input type="text" id="lastName" required maxlength="50">
                    </div>
                    <div class="form-group">
                        <label for="email">Email *</label>
                        <input type="email" id="email" required>
                    </div>
                    <div class="form-group">
                        <label for="phoneNumber">Phone Number *</label>
                        <input type="text" id="phoneNumber" required pattern="^\+?[1-9]\d{1,14}$" placeholder="+14155551234">
                    </div>
                    <div class="form-group">
                        <label for="address">Address</label>
                        <input type="text" id="address" maxlength="255">
                    </div>
                    <div class="form-group">
                        <label for="category">Category</label>
                        <input type="text" id="category" maxlength="50">
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">Save</button>
                        <button type="button" id="cancelBtn" class="btn btn-secondary">Cancel</button>
                    </div>
                </form>
            </div>
        </div>

        <div id="error" class="error"></div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
