<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Address Book</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
        <h1>Address Book</h1>

        <section id="contact-form-section">
            <h2 id="form-title">Add Contact</h2>
            <form id="contact-form">
                <input type="hidden" id="contact-id">
                <input type="text" id="firstName" placeholder="First Name" required>
                <input type="text" id="lastName" placeholder="Last Name" required>
                <input type="email" id="email" placeholder="Email" required>
                <input type="text" id="phoneNumber" placeholder="Phone Number" required>
                <input type="text" id="address" placeholder="Address" required>
                <input type="text" id="category" placeholder="Category (e.g. Family)" required>
                <button type="submit" id="submit-btn">Save Contact</button>
                <button type="button" id="cancel-btn" style="display:none;">Cancel</button>
            </form>
        </section>

        <hr>

        <section id="search-section">
            <input type="text" id="search-query" placeholder="Search by name or category...">
            <button id="search-btn">Search</button>
            <button id="clear-btn">Clear</button>
        </section>

        <section id="list-section">
            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>Category</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="contact-list"></tbody>
            </table>
        </section>
    </div>
    <script src="js/app.js"></script>
</body>
</html>
