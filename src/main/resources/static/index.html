<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Address Book</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
        <h1>Address Book</h1>

        <div class="search-section">
            <input type="text" id="searchInput" placeholder="Search by name or category...">
            <button onclick="handleSearch()">Search</button>
        </div>

        <div class="form-section">
            <h2 id="formTitle">Add New Contact</h2>
            <form id="contactForm">
                <input type="hidden" id="contactId">
                <div class="form-group">
                    <label for="firstName">First Name:</label>
                    <input type="text" id="firstName" required>
                </div>
                <div class="form-group">
                    <label for="lastName">Last Name:</label>
                    <input type="text" id="lastName" required>
                </div>
                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" required>
                </div>
                <div class="form-group">
                    <label for="phoneNumber">Phone Number:</label>
                    <input type="text" id="phoneNumber" required>
                </div>
                <div class="form-group">
                    <label for="address">Address:</label>
                    <input type="text" id="address" required>
                </div>
                <div class="form-group">
                    <label for="category">Category:</label>
                    <input type="text" id="category" required>
                </div>
                <button type="submit" id="submitBtn">Save Contact</button>
                <button type="button" id="cancelBtn" onclick="resetForm()" style="display:none;">Cancel</button>
            </form>
        </div>

        <div class="list-section">
            <h2>Contacts</h2>
            <div id="contactList">
                <!-- Contact cards will be injected here -->
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
