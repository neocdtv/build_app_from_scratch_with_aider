<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>Address Book</title>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body>
<div class="container">
  <h1>Address Book</h1>

  <!-- Search & Filter -->
  <div class="filters">
    <input type="text" id="searchInput" placeholder="Search by name or category..."/>
    <select id="categoryFilter">
      <option value="">All Categories</option>
      <option value="Friend">Friend</option>
      <option value="Colleague">Colleague</option>
      <option value="Family">Family</option>
      <option value="Classmate">Classmate</option>
      <option value="Neighbor">Neighbor</option>
    </select>
  </div>

  <!-- Contact Table -->
  <table id="contactTable">
    <thead>
    <tr>
      <th>Name</th>
      <th>Email</th>
      <th>Phone</th>
      <th>Address</th>
      <th>Category</th>
      <th>Actions</th>
    </tr>
    </thead>
    <tbody id="contactList"></tbody>
  </table>

  <!-- Add/Edit Modal -->
  <div class="modal" id="contactModal">
    <div class="modal-content">
      <span class="close">&times;</span>
      <h2 id="modalTitle">Add Contact</h2>
      <form id="contactForm">
        <input type="hidden" id="contactId"/>
        <div>
          <label>First Name:</label>
          <input type="text" id="firstName" required maxlength="50"/>
        </div>
        <div>
          <label>Last Name:</label>
          <input type="text" id="lastName" required maxlength="50"/>
        </div>
        <div>
          <label>Email:</label>
          <input type="email" id="email" required/>
        </div>
        <div>
          <label>Phone:</label>
          <input type="tel" id="phoneNumber"
                 pattern="^\+?[1-9]\d{1,14}$"
                 required placeholder="+15555555555"/>
        </div>
        <div>
          <label>Address:</label>
          <input type="text" id="address"/>
        </div>
        <div>
          <label>Category:</label>
          <select id="category">
            <option value="">(None)</option>
            <option value="Friend">Friend</option>
            <option value="Colleague">Colleague</option>
            <option value="Family">Family</option>
            <option value="Classmate">Classmate</option>
            <option value="Neighbor">Neighbor</option>
          </select>
        </div>
        <button type="submit" id="saveButton">Save</button>
      </form>
    </div>
  </div>

  <button id="addBtn">+ Add Contact</button>
</div>

<script src="js/app.js"></script>
</body>
</html>
