<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Address Book</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Address Book</h1>
        </header>

        <div class="search-section">
            <form id="searchForm">
                <input type="text" id="searchQuery" placeholder="Search by name, email, phone, or category..." />
                <button type="submit">Search</button>
            </form>
        </div>

        <div class="main-content">
            <div class="add-form-section">
                <h2 id="formTitle">Add Contact</h2>
                <form id="contactForm">
                    <input type="hidden" id="contactId" />
                    
                    <div class="form-group">
                        <label for="firstName">First Name:</label>
                        <input type="text" id="firstName" required maxlength="50" />
                    </div>

                    <div class="form-group">
                        <label for="lastName">Last Name:</label>
                        <input type="text" id="lastName" required maxlength="50" />
                    </div>

                    <div class="form-group">
                        <label for="email">Email:</label>
                        <input type="email" id="email" required maxlength="100" />
                    </div>

                    <div class="form-group">
                        <label for="phoneNumber">Phone Number:</label>
                        <input type="text" id="phoneNumber" required maxlength="20" />
                    </div>

                    <div class="form-group">
                        <label for="address">Address:</label>
                        <input type="text" id="address" required maxlength="255" />
                    </div>

                    <div class="form-group">
                        <label for="category">Category:</label>
                        <input type="text" id="category" required maxlength="50" />
                    </div>

                    <div class="form-actions">
                        <button type="submit" id="submitBtn">Add Contact</button>
                        <button type="button" id="cancelBtn" style="display: none;">Cancel</button>
                    </div>
                </form>
            </div>

            <div class="contacts-list">
                <h2>Contacts</h2>
                <table id="contactsTable">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Phone</th>
                            <th>Category</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="contactsBody">
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
