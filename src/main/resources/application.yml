spring:
  datasource:
    url: jdbc:h2:mem:addressbook
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  sql:
    init:
      mode: always
      data-locations: classpath:data.sql

spring.jpa:
  show-sql: true
  defer-datasource-initialization: true

server:
  port: 8080
